<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <nav>
            <a href="#" class="home">Home</a>
            <a href="#" class="gallery">Gallery</a>
            <a href="#" class="Contact active">Contact</a>
            <a href="#" class="about">About</a>
        </nav>
        <form >
            <fieldset>
                <legend>Your Details:</legend>
                <label>Name</label>
                <input type="text" id="name" name="name">
                <br>

                <label>Email</label>
                <input type="email" id="email" name="email">
                <br>

                <label>Password</label>
                <input type="password" id="password" name="password">
                <br>

                <label>Comments</label>
                <textarea name="comments" id="comments" cols="40" rows="10"></textarea>
                <br>

                <label>How did you hear about us?:</label>
                <select name="options" id="options">
                    <option value="0">Google</option>
                    <option value="1">Facebook</option>
                    <option value="2">Instagram</option>
                </select>
                <br>

                <div>
                    Would you visit again?
                    <input type="radio" name="yes" id="yes">
                    <label for="yes">Yes</label>
                    <input type="radio" name="no" id="no">
                    <label for="no">No</label>
                    <input type="radio" name="maybe" id="maybe">
                    <label for="maybe">Maybe</label>
                </div>
                <br>

                <input type="checkbox" name="agree" id="agree">
                <label for="agree">Sign me up for email updates</label>
                <br>

                <button type="reset">Reset</button>
                <button id="submit_button" >Submit</button>

            </fieldset>
        </form>
    </div>

    <script>
        const nameInput =  document.getElementById('name')
        const emailInput = document.getElementById('email')
        const passwordInput = document.getElementById('password')
        const commentInput = document.getElementById('comments')
        const optionInput = document.getElementById('options')
        const yesRadioInput = document.getElementById('yes')
        const noRadioInput = document.getElementById('no')
        const maybeRadioInput = document.getElementById('maybe')
        const checkboxInput = document.getElementById('agree')
        const submitButton = document.getElementById('submit_button')

        submitButton.addEventListener('click', (e) => {
            e.preventDefault();
            console.log(`Name: ${nameInput.value}`);
            console.log(`Email: ${emailInput.value}`);
            console.log(`Password: ${passwordInput.value}`);
            console.log(`Comments: ${commentInput.value}`);
            console.log(`Option: ${optionInput.value}`);
            console.log(`Yes radio input: ${yesRadioInput.checked}`);
            console.log(`No radio input: ${noRadioInput.checked}`);
            console.log(`Maybe radio input: ${maybeRadioInput.checked}`);
            console.log(`Checkbox input: ${checkboxInput.checked}`);
            
        })
        
    </script>
</body>

</html>

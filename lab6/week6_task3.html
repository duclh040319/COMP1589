    <script>
        function calcRectangleArea(aWidth, aHeight) {
            var area = aWidth * aHeight;

            return area;
        }

        var message = 'Area of ';
        var rectangleArea = calcRectangleArea(10.5, 3);
        console.log(message + ' first rectangle is: ' + rectangleArea);
        rectangleArea = calcRectangleArea(4, 10.2);
        console.log(message + ' second rectangle is: ' + rectangleArea);

    </script>

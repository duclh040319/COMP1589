<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
</head>
<body>
<canvas id="sCanvas" width="800" height="800"></canvas>

<script>
    let randomColor;
    let randomSize;
    let xPos;
    let yPos;
    let i;
    let j;

    const c = document.getElementById('sCanvas')
    const ctx = c.getContext('2d')

    function drawFilledCircle(size, xPos, yPos, color) {
        ctx.beginPath();
        ctx.arc(xPos, yPos, size, 0, 2 + Math.PI);
        ctx.fillStyle = color;
        ctx.fill();
    }

    function drawSplatter(size, xPos, yPos, color) {
        for (j = 0; j < 10; j++) {
            let splatSize = size / Math.round(Math.random() * 30);
            drawFilledCircle(splatSize, xPos + Math.round(Math.random() * 50), yPos + Math.round(Math.random() * 50), color);
        }
    }

    for (i = 0; i < 10; i++) {
        randomSize = Math.round(Math.random() * 50);
        xPos = Math.round(Math.random() * 500);
        yPos = Math.round(Math.random() * 400);
        randomColor = '#' + Math.random().toString(16).substring(2, 8);
        drawFilledCircle(randomSize, xPos, yPos, randomColor);
        drawSplatter(randomSize, xPos, yPos, randomColor);
    }
</script>
</body>
</html>
